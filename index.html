<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, #2b0000, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
    overflow: hidden;
}

.container {
    animation: fadeIn 2.5s ease-in-out;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4.5rem;
    color: #ff4d6d;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(255,77,109,0.6);
}

p {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    letter-spacing: 2px;
    opacity: 0.9;
}

.rose {
    width: 260px;
    margin: 20px auto;
    animation: float 4s ease-in-out infinite;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}
</style>
</head>

<body>
<div class="container">
    <h1>Happy Rose Day</h1>

    <img class="rose" 
    src="https://images.unsplash.com/photo-1519681393784-d120267933ba" 
    alt="Rose">

    <p>Just for you 🌹</p>
</div>
</body>
</html>
